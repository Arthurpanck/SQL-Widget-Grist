<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vue Utilisateur - Bouton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/core/grist-connector.js"></script>
    <script src="../shared/core/data-manager.js"></script>
    <script src="../shared/core/sql-converter.js"></script>
    <script src="../shared/core/button-manager.js"></script>
    <script src="../shared/ui/ui-helpers.js"></script>
    <script src="../shared/ui/page-navigation.js"></script>
    <script src="../shared/ui/navigation.js"></script>
    <script src="user-view-button.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'soft-green': '#a8e6cf',
                        'soft-green-text': '#2e7d32',
                        'soft-orange': '#ffb366',
                        'soft-orange-text': '#5d4037',
                        'soft-pink': '#f8bbd9',
                        'soft-pink-text': '#6a1b9a',
                        'soft-blue': '#a8d8ea',
                        'soft-blue-text': '#1565c0',
                        'soft-purple': '#d1c4e9',
                        'soft-purple-text': '#4527a0',
                        'soft-yellow': '#fff3a0',
                        'soft-yellow-text': '#f57f17',
                        'soft-teal': '#b2dfdb',
                        'soft-teal-text': '#00695c',
                        'soft-coral': '#ffcdd2',
                        'soft-coral-text': '#c62828'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-selector {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1);
            opacity: 1;
            position: relative;
            overflow: hidden;
        }
        .button-selector:hover {
            transform: scale(1.05);
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- État par défaut - Aucun bouton sélectionné -->
    <div id="no-button-state" style="text-align: center; color: #666;">
        <span class="material-icons" style="font-size: 4rem; color: #ccc; display: block; margin-bottom: 1rem;">touch_app</span>
        <h2 style="margin: 0; font-size: 1.5rem; font-weight: 600;">Aucun bouton sélectionné</h2>
    </div>
    
    <!-- Affichage du bouton sélectionné -->
    <div id="button-display" class="hidden">
        <div class="button-selector cursor-pointer flex items-center justify-center p-4 rounded-xl font-medium shadow-md min-w-[120px] text-center" 
             id="user-button" onclick="executeButton()">
            <span id="button-name"></span>
        </div>
    </div>
</body>
</html>
