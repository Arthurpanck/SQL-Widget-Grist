<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vue Utilisateur - Bouton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/core/grist-connector.js"></script>
    <script src="../shared/core/data-manager.js"></script>
    <script src="../shared/core/sql-converter.js"></script>
    <script src="../shared/core/button-manager.js"></script>
    <script src="../shared/ui/ui-helpers.js"></script>
    <script src="../shared/ui/page-navigation.js"></script>
    <script src="../shared/ui/navigation.js"></script>
    <script src="user-view-button.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-card {
            background: #e5e5e5;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            padding: 2rem;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .button-card:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <!-- État par défaut - Aucun bouton sélectionné -->
    <div id="no-button-state" style="text-align: center; color: #666;">
        <span class="material-icons" style="font-size: 4rem; color: #ccc; display: block; margin-bottom: 1rem;">touch_app</span>
        <h2 style="margin: 0; font-size: 1.5rem; font-weight: 600;">Aucun bouton sélectionné</h2>
    </div>
    
    <!-- Affichage du bouton sélectionné -->
    <div id="button-display" class="hidden">
        <div class="button-card" id="user-button" onclick="executeButton()">
            <div style="text-align: center;">
                <span class="material-icons" style="font-size: 3rem; display: block; margin-bottom: 1rem;">play_circle_filled</span>
                <h3 id="button-name" style="margin: 0; font-size: 1.8rem; font-weight: bold;"></h3>
                <p id="button-description" style="margin: 0.5rem 0 0 0; font-size: 0.9rem; opacity: 0.8;"></p>
            </div>
        </div>
    </div>
</body>
</html>
